name: Build and deploy Obelisco real-world level

on:
  push:
    branches: [main]
    paths:
      - "map-generator/src/build_obelisco_world.py"
      - ".github/workflows/build-obelisco-world.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r map-generator/requirements.txt
      - name: Extract real OpenStreetMap features
        run: python map-generator/src/build_obelisco_world.py
      - name: Commit generated level data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/obelisco-world.json
          git diff --cached --quiet || git commit -m "Add real-world Obelisco level data"
          git pull --rebase origin main
          git push
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build game and generated map
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: extract-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
