name: Build and deploy Buenos Aires Perfecta

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "map-generator/src/build_obelisco_world.py"
      - ".github/workflows/build-obelisco-world.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate real Obelisco map data when missing
        run: |
          if [ ! -s public/data/obelisco-world.json ]; then
            python -m pip install --upgrade pip
            pip install -r map-generator/requirements.txt
            python map-generator/src/build_obelisco_world.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/obelisco-world.json
            if ! git diff --cached --quiet; then
              git commit -m "Add real-world Obelisco level data"
              git pull --rebase origin main
              git push
            fi
          else
            echo "Obelisco source extract already exists; reusing it."
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build game and generated map
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
