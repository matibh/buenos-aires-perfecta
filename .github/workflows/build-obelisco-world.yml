name: Build Obelisco real-world level data

on:
  push:
    branches: [main]
    paths:
      - "map-generator/src/build_obelisco_world.py"
      - ".github/workflows/build-obelisco-world.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obelisco-world-data
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r map-generator/requirements.txt
      - name: Extract real OpenStreetMap features
        run: python map-generator/src/build_obelisco_world.py
      - name: Commit generated level data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/obelisco-world.json
          git diff --cached --quiet || git commit -m "Add real-world Obelisco level data"
          git push
