name: Build and deploy Buenos Aires Perfecta

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "map-generator/src/build_obelisco_world.py"
      - ".github/workflows/build-obelisco-world.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Each run gets its own group: a new commit won't cancel an active build.
concurrency:
  group: obelisco-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: map-generator/requirements.txt
      # Persist downloaded CABA GIS archives and OSMnx responses between ephemeral runners.
      # Bump the v1 key when the source datasets should be forcibly refreshed.
      - name: Restore GIS source cache
        uses: actions/cache@v4
        with:
          path: |
            map-generator/.cache
            ~/.cache/osmnx
          key: obelisco-gis-v1-${{ runner.os }}
      - name: Install GIS dependencies
        run: python -m pip install -r map-generator/requirements.txt
      - name: Generate real Obelisco map data
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Regenerate on every relevant source change; emit each network step immediately.
          python -u map-generator/src/build_obelisco_world.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated Obelisco world data [skip ci]"
            # The generated map is the only file in this bot commit. If another run
            # refreshed it first, prefer this run's freshly generated version.
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Build game and generated map
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
