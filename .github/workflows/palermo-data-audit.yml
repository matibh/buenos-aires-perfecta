name: Palermo source data audit

on:
  push:
    branches: [main]
    paths:
      - "map-generator/**"
      - ".github/workflows/palermo-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-map-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r map-generator/requirements.txt
      - name: Download candidate source data
        working-directory: map-generator
        run: python -m src.download_sources --config config/palermo.json
      - name: Inspect downloaded source data
        if: always()
        working-directory: map-generator
        run: python -m src.inspect_sources --config config/palermo.json
      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palermo-source-audit
          path: |
            map-generator/reports/
            map-generator/data/source-metadata.json
          if-no-files-found: warn
          retention-days: 14
